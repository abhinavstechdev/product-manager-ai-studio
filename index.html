    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            }
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch || window.fetch;
              var currentProtoFetch = protoFetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentProtoFetch;
                },
                set: function(val) {
                  currentProtoFetch = val;
                }
              });
            }
          } catch (_) {}
        }
      })();
